<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grok Media Studio — UI Kit</title>
    <style>
/* ============================ colors_and_type.css ============================ */
/* =============================================================================
   GROK MEDIA STUDIO — COLOR & TYPE FOUNDATIONS
   xAI-inspired local media console: near-black canvas, white-first monochrome,
   pill actions, 8px dark cards, hairline borders, mono technical labels.
   Source of truth: grok-media-gallery/DESIGN.md + src/styles.css
   ============================================================================= */

/* ---- Webfonts -------------------------------------------------------------
   DESIGN.md aspires to xAI's proprietary "Universal Sans" + "Geist Mono".
   Universal Sans is not publicly available; the design system's OWN documented
   fallback is Inter, so we ship Inter for UI/body. Geist Mono IS public and is
   used verbatim for the mono technical labels. Swap Inter -> Universal Sans if
   you ever license it. */
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap");

:root {
    color-scheme: dark;

    /* ---- BRAND / PRIMARY --------------------------------------------------- */
    --primary: #ffffff;          /* filled primary pill (Generate), active text */
    --primary-pressed: #dadbdf;  /* pressed primary */
    --on-primary: #0a0a0a;       /* text/icon on a white pill */

    /* ---- TEXT (INK SCALE) -------------------------------------------------- */
    --ink: #ffffff;              /* titles, active control text */
    --ink-soft: #fafaf7;         /* hover ink */
    --body: #dadbdf;             /* normal copy, input text */
    --body-mid: #8b9098;         /* secondary copy / counts (a.k.a. ash) */
    --mute: #7d8187;             /* metadata, placeholders */

    /* ---- SURFACES (NEAR-BLACK CANVAS) -------------------------------------- */
    --canvas: #0a0a0a;           /* page background + structural bars */
    --surface-soft: #0a0a0a;     /* input fill / subtle nested surface */
    --surface-card: #191919;     /* composer panels, prompt box, tiles (level 1) */
    --surface-elevated: #1a1c20; /* hover surface */
    --surface-dark: #050505;     /* deepest scrim */
    --canvas-raised: #202126;    /* menus / popovers / preview (level 2) */

    /* ---- BORDERS / HAIRLINES ----------------------------------------------- */
    --hairline: #212327;         /* default border + divider */
    --hairline-strong: #30343a;  /* focused / selected neutral border (stone) */
    --stone: #30343a;

    /* ---- SEMANTIC ---------------------------------------------------------- */
    --success: #23d18b;
    --success-soft: rgba(35, 209, 139, 0.12);
    --warning: #ffb020;
    --warning-soft: rgba(255, 176, 32, 0.12);
    --danger: #ff4d4f;
    --danger-soft: rgba(255, 77, 79, 0.13);
    --focus: #a0c3ec;            /* keyboard focus ring (breeze blue) */

    /* ---- ACCENTS (USE SPARINGLY, NEVER DECORATIVE) ------------------------- */
    --accent-sunset: #ff7a17;    /* SOLE cost / quota-attention accent */
    --accent-dusk: #7c3aed;      /* rare: distinct non-generation action */
    --accent-breeze: #a0c3ec;    /* focus + diagnostic/info */

    /* ---- GLASS (sticky bars / docks) --------------------------------------- */
    --glass-bg: color-mix(in srgb, var(--canvas) 80%, transparent);
    --glass-border: color-mix(in srgb, var(--hairline) 60%, transparent);

    /* ---- TYPE FAMILIES ----------------------------------------------------- */
    --font-sans: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --font-mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;

    /* ---- TYPE SCALE (token : size / weight / line-height / tracking) ------- */
    --display-sm-size: 28px;  --display-sm-weight: 400; --display-sm-lh: 34px; --display-sm-ls: -0.4px;
    --title-md-size: 20px;    --title-md-weight: 500;   --title-md-lh: 28px;   --title-md-ls: -0.2px;
    --body-md-size: 15px;     --body-md-weight: 400;    --body-md-lh: 22px;    --body-md-ls: 0;
    --body-sm-size: 14px;     --body-sm-weight: 400;    --body-sm-lh: 20px;    --body-sm-ls: 0;
    --caption-size: 12px;     --caption-weight: 500;    --caption-lh: 16px;    --caption-ls: 1.1px;
    --caption-sm-size: 11px;  --caption-sm-weight: 500; --caption-sm-lh: 14px; --caption-sm-ls: 1px;
    --button-size: 14px;      --button-weight: 500;     --button-lh: 20px;     --button-ls: 0;

    /* ---- RADII ------------------------------------------------------------- */
    --radius-none: 0px;
    --radius-md: 8px;    /* panels, prompt box, tiles, inputs */
    --radius-lg: 12px;   /* large dialogs / preview shells only */
    --radius-full: 9999px; /* buttons, chips, pills, segmented controls */

    /* ---- SPACING (8px grid) ------------------------------------------------ */
    --space-xxs: 2px;
    --space-xs: 4px;
    --space-sm: 8px;
    --space-md: 12px;
    --space-lg: 16px;
    --space-xl: 24px;
    --space-2xl: 32px;
    --space-3xl: 48px;
}

/* Light theme override (the app ships a light mode; depth still from contrast). */
:root[data-theme="light"] {
    color-scheme: light;
    --primary: #0a0a0a;
    --primary-pressed: #25282d;
    --on-primary: #ffffff;
    --ink: #0a0a0a;
    --ink-soft: #191919;
    --body: #25282d;
    --body-mid: #858b94;
    --mute: #626873;
    --canvas: #ffffff;
    --surface-soft: #f5f6f8;
    --surface-card: #ffffff;
    --surface-elevated: #f2f3f5;
    --surface-dark: #0a0a0a;
    --canvas-raised: #ffffff;
    --hairline: #d9dde3;
    --hairline-strong: #d9dde3;
    --stone: #d9dde3;
    --accent-sunset: #d65f0a;
    --glass-bg: color-mix(in srgb, var(--canvas) 92%, transparent);
    --glass-border: color-mix(in srgb, var(--hairline) 50%, transparent);
}

/* =============================================================================
   SEMANTIC TYPE CLASSES
   ============================================================================= */
.ds-display { font-family: var(--font-sans); font-size: var(--display-sm-size); font-weight: var(--display-sm-weight); line-height: var(--display-sm-lh); letter-spacing: var(--display-sm-ls); color: var(--ink); }
.ds-title   { font-family: var(--font-sans); font-size: var(--title-md-size); font-weight: var(--title-md-weight); line-height: var(--title-md-lh); letter-spacing: var(--title-md-ls); color: var(--ink); }
.ds-body    { font-family: var(--font-sans); font-size: var(--body-md-size); font-weight: var(--body-md-weight); line-height: var(--body-md-lh); color: var(--body); }
.ds-body-sm { font-family: var(--font-sans); font-size: var(--body-sm-size); font-weight: var(--body-sm-weight); line-height: var(--body-sm-lh); color: var(--body); }
.ds-button  { font-family: var(--font-sans); font-size: var(--button-size); font-weight: var(--button-weight); line-height: var(--button-lh); }

/* Mono technical labels — the signature scannable uppercase caption. */
.ds-label {
    font-family: var(--font-mono);
    font-size: var(--caption-size);
    font-weight: var(--caption-weight);
    line-height: var(--caption-lh);
    letter-spacing: var(--caption-ls);
    text-transform: uppercase;
    color: var(--mute);
}
.ds-label-sm {
    font-family: var(--font-mono);
    font-size: var(--caption-sm-size);
    font-weight: var(--caption-sm-weight);
    line-height: var(--caption-sm-lh);
    letter-spacing: var(--caption-sm-ls);
    text-transform: uppercase;
    color: var(--mute);
}

/* ============================ styles.css ============================ */
/* =============================================================================
   GROK MEDIA STUDIO — UI KIT STYLES
   Tokens are inlined above (was: ../../colors_and_type.css). Class vocabulary
   mirrors the source app (src/styles.css); the .dock* classes are the enhanced
   sticky composer built for this system.
   ============================================================================= */

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
    background: var(--canvas);
    color: var(--body);
    font-family: var(--font-sans);
    font-size: 16px;
    line-height: 1.4;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
}

.app { max-width: 1320px; margin: 0 auto; padding: 0 24px 96px; }

/* ---- Buttons / pills ------------------------------------------------------ */
button {
    min-height: 40px;
    border: 1px solid var(--hairline);
    border-radius: var(--radius-full);
    background: var(--canvas);
    color: var(--ink);
    padding: 7px 14px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    cursor: pointer;
    font-family: var(--font-sans);
    font-size: 14px; font-weight: 500; line-height: 20px;
    transition: background 160ms ease, border-color 160ms ease, color 160ms ease;
}
button:hover { border-color: var(--stone); background: var(--surface-elevated); color: var(--ink); }
button:active { background: var(--stone); }
button:disabled { color: var(--body-mid); border-color: var(--hairline); background: var(--canvas); cursor: not-allowed; opacity: .7; }
button.primary { background: var(--primary); color: var(--on-primary); border-color: var(--primary); font-weight: 600; }
button.primary:hover, button.primary:active { background: var(--primary-pressed); color: var(--on-primary); }
button.icon-only { width: 40px; height: 40px; padding: 0; }
button:focus-visible, [role="button"]:focus-visible, input:focus-visible, textarea:focus-visible {
    outline: 2px solid var(--focus); outline-offset: 2px;
}

/* ---- Mono label ----------------------------------------------------------- */
.label {
    font-family: var(--font-mono); font-size: 11px; font-weight: 500;
    letter-spacing: 1px; text-transform: uppercase; color: var(--mute);
}

/* =============================================================================
   TOP BAR
   ============================================================================= */
.hero {
    position: sticky; top: 0; z-index: 50;
    min-height: 72px;
    display: flex; align-items: center; justify-content: space-between; gap: 24px;
    padding: 14px 0;
    background: color-mix(in srgb, var(--canvas) 92%, transparent);
    border-bottom: 1px solid var(--hairline);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
}
.heroTitle { min-width: 0; }
.heroWordmark { font-size: 20px; font-weight: 600; letter-spacing: -0.2px; color: var(--ink); }
.heroSub { color: var(--mute); font-size: 12px; margin-top: 2px; }
.heroActions { display: flex; align-items: center; gap: 8px; }

.barPill {
    display: inline-flex; align-items: center; gap: 8px;
    min-height: 36px; padding: 6px 12px;
    border: 1px solid var(--hairline); border-radius: var(--radius-full);
    background: var(--canvas); color: var(--body);
    font-size: 11px; font-weight: 700; letter-spacing: 0.04em; line-height: 1; cursor: pointer;
}
.barPill:hover { color: var(--ink); border-color: var(--stone); background: var(--surface-card); }
.barPill .statusDot { width: 8px; height: 8px; border-radius: var(--radius-full); background: var(--success); }
.barPillLabel { text-transform: uppercase; color: var(--ink); }

.usageWidget {
    display: flex; align-items: center; gap: 10px;
    min-height: 42px; padding: 5px 14px;
    border: 1px solid var(--glass-border); border-radius: var(--radius-md);
    background: var(--glass-bg); backdrop-filter: blur(16px);
    cursor: pointer;
}
.usageWidget:hover { border-color: var(--hairline); }
.usageCost { display: flex; flex-direction: column; line-height: 1.15; gap: 1px; }
.usageCostLabel { color: var(--mute); font-size: 9px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; white-space: nowrap; }
.usageCostValue { font-size: 17px; font-weight: 700; color: var(--accent-sunset); letter-spacing: -0.02em; font-family: var(--font-mono); white-space: nowrap; }
.usageDivider { width: 1px; align-self: stretch; margin: 4px 0; background: var(--hairline); }
.usageOutputs { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.15; gap: 1px; }
.usageOutputsValue { font-size: 15px; font-weight: 600; color: var(--ink); font-family: var(--font-mono); }
.usageOutputsLabel { color: var(--mute); font-size: 9px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; white-space: nowrap; }

/* =============================================================================
   FULL COMPOSER
   ============================================================================= */
.panel {
    background: var(--surface-card); border: 1px solid var(--hairline);
    border-radius: var(--radius-md); padding: 24px;
}
.composer { display: flex; flex-direction: column; gap: 16px; margin-top: 16px; }

.composerHeader { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.modeSelector {
    display: inline-flex; gap: 4px; padding: 4px;
    border: 1px solid var(--hairline); border-radius: var(--radius-full); background: var(--canvas);
}
.modeChip {
    min-height: 36px; background: transparent; border-color: transparent;
    color: var(--body); padding: 8px 16px; gap: 7px;
}
.modeChip:hover { background: var(--surface-elevated); }
.modeChip.active { background: var(--ink); color: var(--canvas); border-color: var(--ink); }
.modeChip.active:hover { background: var(--ink); }

.modeNotice {
    display: inline-flex; align-items: center; gap: 12px;
    padding: 5px 6px 5px 14px; border: 1px solid var(--stone);
    border-radius: var(--radius-full); background: var(--surface-card);
}
.modeNoticeLabel { display: inline-flex; align-items: center; gap: 6px; color: var(--ink); font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
.modeExit { min-height: 30px; padding: 4px 10px; font-size: 12px; gap: 5px; }

/* Settings strip */
.settingsStrip {
    border: 1px solid var(--hairline); border-radius: var(--radius-md);
    background: var(--surface-card); padding: 16px;
    display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start;
}
.settingsGroup { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.settingsGroup > .label { padding-left: 2px; }

.chipList { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
    min-height: 36px; border-radius: var(--radius-full); background: var(--canvas);
    color: var(--body); padding: 8px 16px; font-size: 14px; font-weight: 500;
    border: 1px solid var(--hairline); transition: all 120ms ease;
}
.chip:hover { background: var(--surface-elevated); color: var(--ink); }
.chip.active { background: var(--ink); color: var(--canvas); border-color: var(--ink); }

.chipSelect {
    min-height: 36px; min-width: 92px; border-radius: var(--radius-full);
    border: 1px solid var(--hairline); background: var(--canvas); color: var(--body);
    padding: 6px 14px; font-size: 14px; font-weight: 500; font-family: var(--font-sans); cursor: pointer;
}
.chipSelect.active { border-color: var(--ink); background: var(--ink); color: var(--canvas); }

.segmented {
    display: inline-flex; background: var(--canvas); border: 1px solid var(--hairline);
    border-radius: var(--radius-full); padding: 4px; gap: 4px; width: max-content;
}
.segmented button {
    min-height: 32px; padding: 4px 12px; border-radius: var(--radius-full);
    border: 0; background: transparent; color: var(--mute); font-size: 13px; font-weight: 500;
}
.segmented button:hover { background: var(--surface-elevated); color: var(--ink); }
.segmented button.active { background: var(--ink); color: var(--canvas); }

.durationStepper {
    display: inline-grid; grid-template-columns: 42px minmax(64px, 1fr) 42px;
    width: 168px; gap: 4px; border: 1px solid var(--hairline);
    border-radius: var(--radius-full); background: var(--canvas); padding: 4px;
}
.durationStepper button { width: 42px; min-height: 32px; border: 0; border-radius: var(--radius-full); background: transparent; color: var(--mute); padding: 0; font-size: 18px; }
.durationStepper button:hover:not(:disabled) { background: var(--ink); color: var(--canvas); }
.durationStepper output { display: inline-flex; min-height: 32px; align-items: center; justify-content: center; border-radius: var(--radius-full); background: var(--ink); color: var(--canvas); font-size: 14px; font-weight: 600; font-family: var(--font-mono); }

/* Prompt panel */
.promptPanel {
    border: 1px solid var(--hairline); border-radius: var(--radius-md);
    background: var(--surface-card); display: flex; flex-direction: column;
}
.promptPanel.drag-active { outline: 2px dashed var(--primary); outline-offset: 4px; }
.promptLabelRow { display: flex; align-items: center; justify-content: space-between; padding: 16px 16px 0; }
.promptHint { color: var(--mute); font-size: 12px; font-family: var(--font-mono); }
.promptShell { position: relative; }
.promptPanel textarea {
    width: 100%; min-height: 150px; resize: vertical; border: 0; background: transparent;
    padding: 14px 16px; color: var(--ink); font-family: var(--font-sans); font-size: 15px; line-height: 1.5;
}
.promptPanel textarea::placeholder { color: var(--mute); }
.promptPanel textarea:focus { outline: none; }
.promptShell.hasRefs textarea { padding-bottom: 88px; }

.referenceList { position: absolute; left: 12px; right: 16px; bottom: 12px; pointer-events: none; }
.referenceRail { display: flex; gap: 7px; overflow-x: auto; pointer-events: auto; scrollbar-width: none; }
.referenceRail::-webkit-scrollbar { display: none; }
.referenceTile {
    position: relative; flex: 0 0 64px; height: 64px; border: 1px solid var(--hairline);
    border-radius: var(--radius-md); background: var(--canvas); overflow: hidden; cursor: pointer;
}
.referenceTile img { width: 100%; height: 100%; object-fit: cover; display: block; }
.referenceOrdinal {
    position: absolute; top: 4px; left: 4px; z-index: 2; padding: 1px 6px;
    border-radius: var(--radius-full); background: color-mix(in srgb, var(--surface-dark) 82%, transparent);
    color: #fff; font-family: var(--font-mono); font-size: 9px; font-weight: 700;
}
.referenceRemove {
    position: absolute; top: 4px; right: 4px; z-index: 3; width: 22px; height: 22px; min-height: 22px;
    padding: 0; border-radius: var(--radius-full); background: color-mix(in srgb, var(--canvas) 88%, transparent);
    color: var(--ink); opacity: 0; transition: opacity 160ms ease; backdrop-filter: blur(8px);
}
.referenceTile:hover .referenceRemove { opacity: 1; }

.promptToolbar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 16px; border-top: 1px solid var(--hairline); flex-wrap: wrap;
}
.promptToolbarLeft { display: flex; align-items: center; gap: 8px; position: relative; }
.promptToolbarRight { display: flex; align-items: center; gap: 12px; }
.attachButton { gap: 7px; }
.attachButton span { color: var(--mute); font-size: 12px; font-family: var(--font-mono); }
.costHint { color: var(--mute); font-size: 12px; font-family: var(--font-mono); white-space: nowrap; }
.costHint b { color: var(--accent-sunset); font-weight: 600; }
.generateButton { gap: 7px; padding: 9px 20px; }

/* Reference library popover */
.referenceLibrary {
    position: absolute; bottom: calc(100% + 8px); left: 0; z-index: 80;
    width: min(440px, calc(100vw - 48px)); display: flex; flex-direction: column; gap: 8px;
    border: 1px solid var(--hairline); border-radius: var(--radius-md);
    background: var(--canvas-raised); padding: 12px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.35); animation: fadeInUp 160ms ease both;
}
.referenceLibraryTop { display: flex; align-items: center; justify-content: space-between; }
.referenceLibraryTop strong { color: var(--ink); font-size: 12px; font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.08em; }
.savedGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; max-height: 320px; overflow: auto; }
.savedTile { display: flex; flex-direction: column; gap: 6px; padding: 6px; border: 1px solid var(--hairline); border-radius: var(--radius-md); background: var(--canvas); cursor: pointer; text-align: left; }
.savedTile:hover { border-color: var(--stone); }
.savedTile.disabled { opacity: 0.45; cursor: not-allowed; }
.savedTile .thumb { aspect-ratio: 1; border-radius: 6px; overflow: hidden; background: var(--surface-card); }
.savedTile .thumb img { width: 100%; height: 100%; object-fit: cover; }
.savedTile .nm { font-size: 11px; color: var(--body); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.savedTile .mt { font-size: 10px; color: var(--mute); font-family: var(--font-mono); text-transform: uppercase; }

/* =============================================================================
   ENHANCED STICKY COMPOSER (the dock)
   Carries the full composer state forward instead of collapsing to a stub.
   ============================================================================= */
.dock {
    position: fixed; top: 80px; left: 0; right: 0; z-index: 49;
    max-width: 1320px; margin: 0 auto; padding: 0 24px;
    pointer-events: none;
}
.dockBar {
    pointer-events: auto;
    display: flex; align-items: center; gap: 10px;
    padding: 8px 10px;
    border: 1px solid var(--glass-border); border-radius: var(--radius-full);
    background: color-mix(in srgb, var(--canvas) 90%, transparent);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    box-shadow: 0 16px 40px -20px rgba(0,0,0,0.7);
    opacity: 0; transform: translateY(-12px);
    transition: opacity 0.2s ease, transform 0.2s ease;
}
.dock.visible .dockBar { opacity: 1; transform: translateY(0); }
.dock:not(.visible) .dockBar { pointer-events: none; }

/* compact icon-only mode segmented */
.dockModes { display: inline-flex; gap: 3px; padding: 3px; border: 1px solid var(--hairline); border-radius: var(--radius-full); background: var(--canvas); flex: 0 0 auto; }
.dockMode { width: 34px; height: 34px; min-height: 34px; padding: 0; background: transparent; border-color: transparent; color: var(--mute); }
.dockMode:hover { background: var(--surface-elevated); color: var(--ink); }
.dockMode.active { background: var(--ink); color: var(--canvas); }

/* reference mini-thumbs carried forward */
.dockRefs { display: inline-flex; align-items: center; gap: 4px; flex: 0 0 auto; }
.dockRefThumb { position: relative; width: 32px; height: 32px; border-radius: 7px; overflow: hidden; border: 1px solid var(--hairline); }
.dockRefThumb img { width: 100%; height: 100%; object-fit: cover; }
.dockRefThumb .ord { position: absolute; left: 2px; top: 2px; font-family: var(--font-mono); font-size: 8px; font-weight: 700; color: #fff; background: color-mix(in srgb, var(--surface-dark) 82%, transparent); padding: 0 3px; border-radius: 5px; }
.dockRefMore { font-family: var(--font-mono); font-size: 11px; font-weight: 600; color: var(--mute); padding: 0 4px; }

/* prompt input */
.dockField { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; }
.dockInput {
    width: 100%; height: 38px; padding: 0 16px;
    border: 1px solid var(--hairline); border-radius: var(--radius-full);
    background: var(--surface-soft); color: var(--ink);
    font-family: var(--font-sans); font-size: 14px;
}
.dockInput::placeholder { color: var(--mute); }
.dockInput:focus { outline: none; border-color: var(--ink); }

/* the settings SUMMARY chip — shows the live config, opens full controls */
.dockSummary {
    flex: 0 0 auto; display: inline-flex; align-items: center; gap: 8px;
    min-height: 38px; padding: 0 12px; white-space: nowrap;
    border: 1px solid var(--hairline); border-radius: var(--radius-full);
    background: var(--surface-card); color: var(--body); cursor: pointer;
    font-family: var(--font-mono); font-size: 12px; font-weight: 500;

    <script>
/* Shared generation-settings controls. Rendered both in the full composer's
   settings strip AND inside the sticky dock's settings popover, so the docked
   composer exposes the exact same configuration the full one does. */
const { createElement: e2 } = React;

const ASPECTS = ["auto", "16:9", "1:1", "9:16", "4:3", "3:4", "2:3", "3:2", "2:1", "1:2"];
const ASPECTS_MORE = ["19.5:9", "9:19.5", "20:9", "9:20"];
const VIDEO_ASPECTS = ["16:9", "9:16", "1:1", "4:3", "3:4", "3:2", "2:3"];
const IMAGE_MODELS = [
  { id: "grok-imagine-image", label: "Normal" },
  { id: "grok-imagine-image-quality", label: "Quality" },
];

function Group({ label, children }) {
  return e2("div", { className: "settingsGroup" },
    e2("span", { className: "label" }, label),
    children
  );
}

function Segmented({ options, value, onChange }) {
  return e2("div", { className: "segmented", role: "group" },
    options.map((o) =>
      e2("button", {
        key: o.id ?? o,
        type: "button",
        className: value === (o.id ?? o) ? "active" : "",
        "aria-pressed": value === (o.id ?? o),
        onClick: () => onChange(o.id ?? o),
      }, o.label ?? o)
    )
  );
}

/* The full set of generation controls, mode-aware. */
function SettingsControls({ state, set }) {
  const { mode, aspectRatio, imageModel, resolution, videoResolution, duration, count } = state;
  const isVideo = mode !== "image";
  const aspects = isVideo ? VIDEO_ASPECTS : ASPECTS;
  const showMore = !isVideo;

  return e2("div", { className: "dockSettingsGrid" },
    // Aspect ratio
    e2(Group, { label: "Ratio" },
      e2("div", { className: "chipList" },
        aspects.map((r) =>
          e2("button", {
            key: r, type: "button",
            className: `chip ${aspectRatio === r ? "active" : ""}`,
            "aria-pressed": aspectRatio === r,
            onClick: () => set({ aspectRatio: r }),
          }, r)
        ),
        showMore && e2("select", {
          className: `chipSelect ${ASPECTS_MORE.includes(aspectRatio) ? "active" : ""}`,
          "aria-label": "More aspect ratios",
          value: ASPECTS_MORE.includes(aspectRatio) ? aspectRatio : "",
          onChange: (ev) => ev.target.value && set({ aspectRatio: ev.target.value }),
        },
          e2("option", { value: "" }, "More"),
          ASPECTS_MORE.map((r) => e2("option", { key: r, value: r }, r))
        )
      )
    ),
    // Model (image) / Duration (video)
    isVideo
      ? e2(Group, { label: "Duration" },
          e2("div", { className: "durationStepper", role: "group", "aria-label": "Video duration" },
            e2("button", { type: "button", "aria-label": "Decrease", disabled: duration <= 2, onClick: () => set({ duration: Math.max(2, duration - 1) }) }, "–"),
            e2("output", null, `${duration}s`),
            e2("button", { type: "button", "aria-label": "Increase", disabled: duration >= 10, onClick: () => set({ duration: Math.min(10, duration + 1) }) }, "+")
          )
        )
      : e2(Group, { label: "Model" },
          e2(Segmented, { options: IMAGE_MODELS, value: imageModel, onChange: (v) => set({ imageModel: v }) })
        ),
    // Resolution
    e2(Group, { label: "Resolution" },
      isVideo
        ? e2(Segmented, { options: ["480P", "720P"], value: videoResolution, onChange: (v) => set({ videoResolution: v }) })
        : e2(Segmented, { options: ["1K", "2K"], value: resolution, onChange: (v) => set({ resolution: v }) })
    ),
    // Count (image only)
    !isVideo && e2(Group, { label: "Images" },
      e2(Segmented, { options: [1, 2, 3, 4], value: count, onChange: (v) => set({ count: v }) })
    )
  );
}

/* A compact, human summary of the current config, e.g. "16:9 · Quality · 2K · ×2". */
function settingsSummary(state) {
  const isVideo = state.mode !== "image";
  const parts = [state.aspectRatio];
  if (isVideo) {
    parts.push(state.videoResolution, `${state.duration}s`);
  } else {
    const model = IMAGE_MODELS.find((m) => m.id === state.imageModel);
    parts.push(model ? model.label : "Normal", state.resolution, `×${state.count}`);
  }
  return parts;
}

/* Rough estimated cost in USD for the cost hint / dock usage. */
function estimateCost(state) {
  const isVideo = state.mode !== "image";
  if (isVideo) {
    const base = state.videoResolution === "720P" ? 0.18 : 0.1;
    return base * state.duration;
  }
  const base = state.imageModel.includes("quality") ? 0.08 : 0.04;
  const res = state.resolution === "2K" ? 1.6 : 1;
  return base * res * state.count;
}

Object.assign(window, { SettingsControls, settingsSummary, estimateCost, IMAGE_MODELS, ASPECTS, VIDEO_ASPECTS });

      ),

        ),

          e4("button", {
            type: "button", className: "primary generateButton",
            disabled: busy || !state.prompt.trim(),
            onClick: onGenerate,
            title: !state.prompt.trim() ? "Enter a prompt" : "Generate",
          }, e4(Icon.Sparkles, { size: 16 }), busy ? "Working…" : isVideo ? "Generate video" : "Generate")
        )
      )
    ),
    // queue
    jobs.length > 0 && e4("div", { className: "queuePanel", "aria-label": "Generation queue" },
      e4("div", { className: "queueHeader" },
        e4("h2", null, "Active queue"),
        e4("span", null, `${jobs.length} active`)
      ),
      jobs.map((j) =>
        e4("div", { key: j.id, className: `queueJob ${j.status}` },
          e4("div", { className: "queueJobTitle" },

            e4("strong", null, j.label)
          ),

    <!-- StickyComposer.jsx -->
    <script>
/* Enhanced sticky composer (dock). Unlike a bare collapsed input, this carries the
   full composer state forward: active mode, reference thumbnails, a live settings
   SUMMARY (ratio · model · resolution · count/duration) that expands to the full
   controls, estimated usage, and Generate. */
const { createElement: e5, useState: useState5 } = React;

function DockSettingsPopover({ state, set, onClose }) {
  return e5("div", { className: "dockSettingsPop", role: "dialog", "aria-label": "Generation settings" },
    e5("div", { className: "popHeader" },
      e5("strong", null, "Generation settings"),
      e5("button", { type: "button", className: "icon-only", style: { width: 32, height: 32, minHeight: 32 }, onClick: onClose, "aria-label": "Close" }, e5(Icon.X, { size: 14 }))
    ),
    e5(SettingsControls, { state, set })
  );
}

function StickyComposer({ visible, state, set, refs, onGenerate, busy, onExpand }) {
  const [settingsOpen, setSettingsOpen] = useState5(false);
  const isVideo = state.mode !== "image";
  const cost = estimateCost(state);
  const summary = settingsSummary(state);
  const showOrdinals = state.mode === "reference-to-video" && refs.length > 1;

  return e5("div", { className: `dock ${visible ? "visible" : ""}`, "aria-hidden": !visible },
    e5("div", { className: "dockBar" },
      // compact mode segmented (icon only)
      e5("div", { className: "dockModes", "aria-label": "Output type" },
        MODES.map((m) =>
          e5("button", {
            key: m.id, type: "button",
            className: `dockMode ${state.mode === m.id ? "active" : ""}`,
            "aria-pressed": state.mode === m.id, title: m.label,
            tabIndex: visible ? 0 : -1,
            onClick: () => set({ mode: m.id }),
          }, modeIcon(m.id))
        )
      ),
      // reference mini-thumbs carried forward
      refs.length > 0 && e5("div", { className: "dockRefs", title: `${refs.length} reference${refs.length === 1 ? "" : "s"}` },
        refs.slice(0, 3).map((r, i) =>
          e5("div", { className: "dockRefThumb", key: r.path },
            showOrdinals && e5("span", { className: "ord" }, i + 1),
            e5("img", { src: r.url, alt: r.name })
          )
        ),
        refs.length > 3 && e5("span", { className: "dockRefMore" }, `+${refs.length - 3}`)
      ),
      // prompt input
      e5("div", { className: "dockField" },
        e5("input", {
          type: "text", className: "dockInput", value: state.prompt,
          placeholder: "Describe what to generate…", "aria-label": "Prompt",
          tabIndex: visible ? 0 : -1,
          onChange: (ev) => set({ prompt: ev.target.value }),
          onKeyDown: (ev) => { if (ev.key === "Enter" && !busy && state.prompt.trim()) onGenerate(); },
        })
      ),
      // live settings summary -> opens full controls
      e5("div", { style: { position: "relative", flex: "0 0 auto" } },
        e5("button", {
          type: "button", className: "dockSummary",
          "aria-expanded": settingsOpen, tabIndex: visible ? 0 : -1,
          title: "Generation settings",
          onClick: () => setSettingsOpen((o) => !o),
        },
          e5(Icon.Sliders, { size: 14 }),
          e5("span", { className: "summaryFull" },
            summary.map((s, i) => [
              i > 0 && e5("span", { className: "sep", key: `s${i}` }, " · "),
              e5("span", { className: "val", key: `v${i}` }, s),
            ])
          ),
          e5(settingsOpen ? Icon.ChevronUp : Icon.ChevronDown, { size: 13 })
        ),
        settingsOpen && e5(DockSettingsPopover, { state, set, onClose: () => setSettingsOpen(false) })
      ),
      // estimated usage mini
      e5("div", { className: "dockUsage", title: "Estimated cost for this run" },
        e5("span", { className: "dockUsageVal" }, `$${cost.toFixed(2)}`),
        e5("span", { className: "dockUsageLabel" }, "Est.")
      ),
      // generate
      e5("button", {
        type: "button", className: "primary dockGenerate",
        disabled: busy || !state.prompt.trim(), tabIndex: visible ? 0 : -1,
        onClick: onGenerate,
        title: !state.prompt.trim() ? "Enter a prompt" : "Generate",
      }, e5(Icon.Sparkles, { size: 15 }), busy ? "Working…" : isVideo ? "Generate" : "Generate"),
      // expand back to full composer
      e5("button", {
        type: "button", className: "icon-only dockExpand",
        tabIndex: visible ? 0 : -1, "aria-label": "Open full composer", title: "Open full composer",
        onClick: onExpand,
      }, e5(Icon.ChevronUp, { size: 15 }))
    )
  );
}

Object.assign(window, { StickyComposer });

    </script>
    <!-- Gallery.jsx -->
    <script>
/* Gallery toolbar + dense media grid. Media-first, minimal tile chrome. */
const { createElement: e6, useState: useState6 } = React;

const AR_MAP = { "16:9": "16/9", "9:16": "9/16", "1:1": "1/1", "4:3": "4/3", "3:4": "3/4", "2:3": "2/3", "3:2": "3/2", "2:1": "2/1", "1:2": "1/2", auto: "1/1" };

function Gallery({ items }) {
  const [kind, setKind] = useState6("all");
  const [query, setQuery] = useState6("");
  const [sort, setSort] = useState6("newest");

  let shown = items.filter((it) => (kind === "all" ? true : it.kind === kind));
  if (query.trim()) {
    const q = query.toLowerCase();
    shown = shown.filter((it) => it.prompt.toLowerCase().includes(q) || (it.name || "").toLowerCase().includes(q));
  }
  if (sort === "oldest") shown = [...shown].reverse();

  return e6(React.Fragment, null,
    e6("section", { className: "toolbar" },
      e6("div", { className: "toolbarFilters" },
        e6("span", { className: "toolbarLabel" }, "Gallery"),
        e6("div", { className: "tabGroup", "aria-label": "Media types" },
          [{ id: "all", label: "All" }, { id: "image", label: "Images" }, { id: "video", label: "Videos" }].map((o) =>
            e6("button", { key: o.id, type: "button", className: `tabBtn ${kind === o.id ? "active" : ""}`, "aria-pressed": kind === o.id, onClick: () => setKind(o.id) }, o.label)
          )
        ),
        e6("span", { className: "countPill" }, shown.length, e6("small", null, `of ${items.length}`))
      ),
      e6("div", { className: "toolbarRight" },
        e6("div", { className: "tabGroup" },
          [{ id: "newest", label: "Newest" }, { id: "oldest", label: "Oldest" }].map((s) =>
            e6("button", { key: s.id, type: "button", className: `chip ${sort === s.id ? "active" : ""}`, onClick: () => setSort(s.id) }, s.label)
          )
        ),
        e6("input", { className: "searchInput", placeholder: "Search results, prompts, paths…", value: query, onChange: (ev) => setQuery(ev.target.value) })
      )
    ),
    e6("div", { className: "galleryGrid" },
      shown.map((it) =>
        e6("div", { key: it.id, className: "mediaTile", style: { "--ar": AR_MAP[it.ratio] || "1/1" } },
          e6("img", { className: "media", src: it.url, alt: it.prompt, loading: "lazy" }),
          e6("span", { className: "mediaKindBadge" }, it.kind === "video" ? e6(Icon.Play, { size: 10 }) : e6(Icon.Image, { size: 10 }), it.kind),
          e6("div", { className: "mediaCaption" },
            e6("span", null, it.prompt),
            e6("span", { className: "ratio" }, `${it.ratio} · ${it.kind === "video" ? it.res + " · " + it.dur + "s" : it.res}`)
          )
        )
      )
    )
  );
}

Object.assign(window, { Gallery });

    </script>
    <!-- App.jsx -->
    <script>
/* App orchestrator: holds composer state, swaps full composer <-> sticky dock on
   scroll, runs a fake generate flow into the gallery. */
const { createElement: c, useState, useRef, useEffect, useCallback } = React;

const A = "assets/media";
const M = (n) => `${A}/m${n}.jpg`;

const SEED_GALLERY = [
  { id: "g1", kind: "image", ratio: "16:9", res: "2K", url: M(1), prompt: "Desert horizon at golden hour, volumetric haze" },
  { id: "g2", kind: "image", ratio: "1:1", res: "1K", url: M(2), prompt: "Macro study of teal mineral, soft studio light" },
  { id: "g3", kind: "video", ratio: "9:16", res: "720P", dur: 6, url: M(3), prompt: "Vertical drift through emerald canopy, slow dolly" },
  { id: "g4", kind: "image", ratio: "4:3", res: "2K", url: M(4), prompt: "Quiet interior, warm rim light across a wall" },
  { id: "g5", kind: "image", ratio: "3:4", res: "1K", url: M(5), prompt: "Portrait of mauve smoke against deep shadow" },
  { id: "g6", kind: "video", ratio: "16:9", res: "480P", dur: 4, url: M(6), prompt: "Graphite landscape, fog rolling left to right" },
  { id: "g7", kind: "image", ratio: "1:1", res: "2K", url: M(7), prompt: "Sunset bloom over dark water, long exposure" },
  { id: "g8", kind: "image", ratio: "3:2", res: "2K", url: M(8), prompt: "Cinematic teal interior, anamorphic flare" },
  { id: "g9", kind: "video", ratio: "9:16", res: "720P", dur: 8, url: M(9), prompt: "Forest light shafts, gentle parallax pan" },
  { id: "g10", kind: "image", ratio: "1:1", res: "1K", url: M(10), prompt: "Amber dust suspended in a single beam" },
  { id: "g11", kind: "image", ratio: "16:9", res: "2K", url: M(11), prompt: "Mauve dunes under a low violet sky" },
  { id: "g12", kind: "image", ratio: "4:3", res: "1K", url: M(12), prompt: "Soft graphite gradient, fine film grain" },
];

const SEED_SAVED = [
  { path: `${A}/ref1.jpg`, url: `${A}/ref1.jpg`, name: "ref-dusk-01.jpg", role: "used", uses: 3, kind: "image" },
  { path: `${A}/ref2.jpg`, url: `${A}/ref2.jpg`, name: "ref-green-02.jpg", role: "used", uses: 1, kind: "image" },
  { path: `${A}/ref3.jpg`, url: `${A}/ref3.jpg`, name: "ref-blue-03.jpg", role: "upload", kind: "image" },
  { path: `${A}/ref4.jpg`, url: `${A}/ref4.jpg`, name: "ref-mauve-04.jpg", role: "upload", kind: "image" },
  { path: `${A}/ref5.jpg`, url: `${A}/ref5.jpg`, name: "ref-graphite-05.jpg", role: "used", uses: 2, kind: "image" },
];

function App() {
  const [state, setState] = useState({
    mode: "image",
    prompt: "A lone figure on a dune ridge at golden hour, volumetric light, cinematic",
    aspectRatio: "16:9",
    imageModel: "grok-imagine-image-quality",
    resolution: "2K",
    videoResolution: "720P",
    duration: 6,
    count: 2,
  });
  const set = useCallback((patch) => setState((s) => ({ ...s, ...patch })), []);

  const [refs, setRefs] = useState([SEED_SAVED[0]]);
  const addRef = useCallback((r) => setRefs((cur) => (cur.some((x) => x.path === r.path) ? cur : [...cur, r])), []);
  const removeRef = useCallback((path) => setRefs((cur) => cur.filter((x) => x.path !== path)), []);

  const [jobs, setJobs] = useState([]);
  const [gallery, setGallery] = useState(SEED_GALLERY);
  const [busy, setBusy] = useState(false);
  const [cost, setCost] = useState(4.86);
  const [outputs, setOutputs] = useState(SEED_GALLERY.length);

  const [dark, setDark] = useState(true);
  useEffect(() => {
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
  }, [dark]);

  // dock visibility: show when the full composer has scrolled out of view
  const composerRef = useRef(null);
  const [docked, setDocked] = useState(false);
  useEffect(() => {
    const onScroll = () => {
      const el = document.getElementById("full-composer");
      if (!el) return;
      const bottom = el.getBoundingClientRect().bottom;
      setDocked(bottom < 96);
    };
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
    window.addEventListener("resize", onScroll);
    return () => { window.removeEventListener("scroll", onScroll); window.removeEventListener("resize", onScroll); };
  }, []);

  const generate = useCallback(() => {
    if (busy || !state.prompt.trim()) return;
    const isVideo = state.mode !== "image";
    const n = isVideo ? 1 : state.count;
    const runCost = estimateCost(state);
    setBusy(true);
    const job = { id: `j${Date.now()}`, kind: isVideo ? "video" : "image", status: "running", label: state.prompt.slice(0, 48) };
    setJobs([job]);
    setTimeout(() => {
      const ratio = state.aspectRatio === "auto" ? "1:1" : state.aspectRatio;
      const made = Array.from({ length: n }).map((_, i) => ({
        id: `${job.id}-${i}`, kind: isVideo ? "video" : "image", ratio,
        res: isVideo ? state.videoResolution : state.resolution,
        dur: state.duration, url: M(((Date.now() + i) % 12) + 1), prompt: state.prompt,
      }));
      setGallery((g) => [...made, ...g]);
      setOutputs((o) => o + n);
      setCost((cc) => +(cc + runCost).toFixed(2));
      setJobs([]);
      setBusy(false);
    }, 2200);
  }, [busy, state]);

  const expandComposer = useCallback(() => {
    window.scrollTo({ top: 0, behavior: "smooth" });
  }, []);

  return c(React.Fragment, null,
    c(TopBar, { totalCost: cost, outputs, dark, onToggleTheme: () => setDark((d) => !d) }),
    c(StickyComposer, { visible: docked, state, set, refs, onGenerate: generate, busy, onExpand: expandComposer }),
    c("div", { className: "app" },
      c("div", { ref: composerRef },
        c(Composer, { state, set, refs, saved: SEED_SAVED, addRef, removeRef, onGenerate: generate, busy, jobs })
      ),
      c(Gallery, { items: gallery })
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(c(App));

    </script>
